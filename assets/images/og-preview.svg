<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="50%" stop-color="#0C0C0C"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <filter id="whiteGlow">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Minimal Grid Lines -->
  <g opacity="0.04" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Clean White Rising Line with Candlesticks -->
  <path d="M 100 480 Q 300 440 500 370 T 850 260 T 1100 130" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.7" filter="url(#whiteGlow)"/>

  <!-- Center Content -->
  <g transform="translate(600, 190)" text-anchor="middle">
    <!-- Free Badge -->
    <rect x="-140" y="-80" width="280" height="42" rx="21" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5"/>
    <text x="0" y="-53" fill="#FFFFFF" font-family="'Cairo', sans-serif" font-weight="700" font-size="18">مجموعة مجانية 100%</text>

    <!-- Headline -->
    <text x="0" y="25" fill="#FFFFFF" font-family="'Cairo', sans-serif" font-weight="900" font-size="64" letter-spacing="-1">Forex Hepa</text>
    <text x="0" y="85" fill="#E5E5E5" font-family="'Cairo', sans-serif" font-weight="800" font-size="32">تعلم الفوريكس وتابع التحليلات اليومية</text>
    <text x="0" y="135" fill="#A3A3A3" font-family="'Cairo', sans-serif" font-weight="500" font-size="20">دخول مباشر بضغطة واحدة • بدون تسجيل • نقاشات مع متداولين حقيقيين</text>

    <!-- Solid White Button -->
    <rect x="-170" y="185" width="340" height="64" rx="32" fill="#FFFFFF" filter="url(#whiteGlow)"/>
    <text x="25" y="226" fill="#0A0A0A" font-family="'Cairo', sans-serif" font-weight="900" font-size="22">انضم للمجموعة مجانا</text>
    <path transform="translate(-110, 204) scale(1.3)" fill="#0A0A0A" d="M12 2L2 9l8 2 2 8 8-17-18 7z"/>
  </g>
</svg>