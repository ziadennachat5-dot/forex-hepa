<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="16" fill="#0A0A0A"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2"/>
  
  <!-- Red Candlestick -->
  <line x1="18" y1="22" x2="18" y2="44" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="14" y="26" width="8" height="13" rx="2" fill="#EF4444"/>
  
  <!-- Main Center Green Candlestick -->
  <line x1="32" y1="12" x2="32" y2="52" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="28" y="18" width="8" height="22" rx="2" fill="#10B981"/>
  
  <!-- Right Green Candlestick -->
  <line x1="46" y1="16" x2="46" y2="42" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="42" y="20" width="8" height="15" rx="2" fill="#10B981"/>
  
  <!-- White Pip Star -->
  <circle cx="46" cy="14" r="2.5" fill="#FFFFFF"/>
</svg>