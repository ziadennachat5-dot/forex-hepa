<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="vbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060606"/>
      <stop offset="50%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
    <filter id="whiteGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#vbg)"/>
  
  <!-- Minimal Grid -->
  <g opacity="0.04" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="60" x2="1280" y2="60"/><line x1="0" y1="120" x2="1280" y2="120"/><line x1="0" y1="180" x2="1280" y2="180"/><line x1="0" y1="240" x2="1280" y2="240"/><line x1="0" y1="300" x2="1280" y2="300"/><line x1="0" y1="360" x2="1280" y2="360"/><line x1="0" y1="420" x2="1280" y2="420"/><line x1="0" y1="480" x2="1280" y2="480"/><line x1="0" y1="540" x2="1280" y2="540"/><line x1="0" y1="600" x2="1280" y2="600"/><line x1="0" y1="660" x2="1280" y2="660"/><line x1="0" y1="720" x2="1280" y2="720"/>
    <line x1="80" y1="0" x2="80" y2="720"/><line x1="160" y1="0" x2="160" y2="720"/><line x1="240" y1="0" x2="240" y2="720"/><line x1="320" y1="0" x2="320" y2="720"/><line x1="400" y1="0" x2="400" y2="720"/><line x1="480" y1="0" x2="480" y2="720"/><line x1="560" y1="0" x2="560" y2="720"/><line x1="640" y1="0" x2="640" y2="720"/><line x1="720" y1="0" x2="720" y2="720"/><line x1="800" y1="0" x2="800" y2="720"/><line x1="880" y1="0" x2="880" y2="720"/><line x1="960" y1="0" x2="960" y2="720"/><line x1="1040" y1="0" x2="1040" y2="720"/><line x1="1120" y1="0" x2="1120" y2="720"/><line x1="1200" y1="0" x2="1200" y2="720"/><line x1="1280" y1="0" x2="1280" y2="720"/>
  </g>

  <!-- Candlesticks in Pure Green and Red -->
  <g opacity="0.8" transform="translate(60, 40)">
    <text x="30" y="50" fill="#FFFFFF" font-family="'Cairo', sans-serif" font-weight="800" font-size="28">XAU / USD (الذهب)</text>
    <rect x="250" y="28" width="55" height="28" rx="6" fill="#1C1C1C"/>
    <text x="277" y="48" fill="#10B981" font-family="'Cairo', sans-serif" font-weight="700" font-size="16" text-anchor="middle">+0.82%</text>

    <!-- Candlesticks -->
    <line x1="80" y1="360" x2="80" y2="480" stroke="#EF4444" stroke-width="2"/>
    <rect x="73" y="380" width="14" height="70" rx="2" fill="#EF4444"/>

    <line x1="130" y1="330" x2="130" y2="440" stroke="#10B981" stroke-width="2"/>
    <rect x="123" y="350" width="14" height="60" rx="2" fill="#10B981"/>

    <line x1="180" y1="300" x2="180" y2="400" stroke="#10B981" stroke-width="2"/>
    <rect x="173" y="310" width="14" height="70" rx="2" fill="#10B981"/>

    <line x1="230" y1="310" x2="230" y2="390" stroke="#EF4444" stroke-width="2"/>
    <rect x="223" y="330" width="14" height="50" rx="2" fill="#EF4444"/>

    <line x1="280" y1="260" x2="280" y2="370" stroke="#10B981" stroke-width="2"/>
    <rect x="273" y="270" width="14" height="80" rx="2" fill="#10B981"/>

    <line x1="330" y1="240" x2="330" y2="330" stroke="#10B981" stroke-width="2"/>
    <rect x="323" y="250" width="14" height="60" rx="2" fill="#10B981"/>

    <line x1="380" y1="200" x2="380" y2="310" stroke="#10B981" stroke-width="2"/>
    <rect x="373" y="210" width="14" height="80" rx="2" fill="#10B981"/>

    <line x1="430" y1="210" x2="430" y2="290" stroke="#EF4444" stroke-width="2"/>
    <rect x="423" y="225" width="14" height="40" rx="2" fill="#EF4444"/>

    <line x1="480" y1="170" x2="480" y2="280" stroke="#10B981" stroke-width="2"/>
    <rect x="473" y="180" width="14" height="70" rx="2" fill="#10B981"/>

    <line x1="530" y1="150" x2="530" y2="260" stroke="#10B981" stroke-width="2"/>
    <rect x="523" y="160" width="14" height="80" rx="2" fill="#10B981"/>
  </g>

  <!-- Dark overlay -->
  <rect width="1280" height="720" fill="rgba(8, 8, 8, 0.65)"/>

  <!-- Solid WHITE Play Button with Black Arrow -->
  <circle cx="640" cy="340" r="54" fill="#FFFFFF" filter="url(#whiteGlow)"/>
  <polygon points="632,320 632,360 660,340" fill="#0A0A0A"/>

  <!-- Captions in White and Soft Gray -->
  <text x="640" y="445" fill="#FFFFFF" font-family="'Cairo', sans-serif" font-weight="800" font-size="30" text-anchor="middle">شاهد جولة حية داخل مجتمع تيليغرام</text>
  <text x="640" y="485" fill="#A3A3A3" font-family="'Cairo', sans-serif" font-weight="500" font-size="20" text-anchor="middle">كيفاش كنشاركو التحليلات والنقاشات اليومية مع الأعضاء</text>
  
  <!-- Duration Badge -->
  <rect x="1140" y="650" width="90" height="34" rx="8" fill="rgba(0,0,0,0.85)"/>
  <text x="1185" y="673" fill="#FFFFFF" font-family="monospace" font-size="16" text-anchor="middle">0:45</text>
</svg>